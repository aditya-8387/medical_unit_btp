<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Unit Login</title>
    <link rel="stylesheet" href="css/medical_login.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <img src="assets/lnmiit-logo.png" alt="LNMIIT Logo">
            <h1>Institute Medical Center</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="about_us.html">About Us</a></li>
                <li><a href="our_services.html">Our Services</a></li>
                <li><a href="announcements.html">Announcements</a></li>
                <li><a href="medical_login.html" class="active">Login</a></li>
                <li><a href="contact_us.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <img src="assets/lnmiit-logo.png" alt="LNMIIT Logo" class="logo">
        <h2>MEDICAL UNIT LOGIN</h2>

        <form id="loginForm" class="login-form">
            <div class="input-field">
                <label for="role">Login as</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="student">Student</option>
                    <option value="medical-staff">Medical Staff</option>
                </select>
            </div>

            <div id="rollno-field" class="input-field">
                <label for="rollno">Roll No.</label>
                <input type="text" id="rollno" name="rollno" placeholder="e.g., 22UCS123" required>
            </div>

            <div class="input-field">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

    <script src="js/medical_login.js"></script>
</body>
</html>
