<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Medical Records</title>
    <!-- Using the same CSS as the student page for a consistent look -->
    <link rel="stylesheet" href="css/medical_stu.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="student-info">
                <div>
                    <h1>Medical Records</h1>
                    <h3 id="employee-name">Welcome, [Employee Name]</h3>
                    <p>Employee Code: <span id="employee-id">Loading...</span></p>
                </div>
                
            </div>
        </div>

        <!-- This section is now for Employee Details -->
        <div class="profile-details">
            <h4>Your Profile Details</h4>
            <div class="display-mode">
                <div class="detail-item">
                    <label>Designation:</label>
                    <span id="employee-designation">Not Set</span>
                </div>
                <div class="detail-item">
                    <label>Department:</label>
                    <span id="employee-department">Not Set</span>
                </div>
            </div>
            <div class="edit-mode">
                <div class="detail-item">
                    <label for="edit-designation">Designation:</label>
                    <input type="text" id="edit-designation" placeholder="e.g., Professor">
                </div>
                <div class="detail-item">
                    <label for="edit-department">Department:</label>
                    <input type="text" id="edit-department" placeholder="e.g., CSE">
                </div>
            </div>
             <div class="edit-controls">
                <button id="edit-details-btn" class="display-mode">Edit Details</button>
                <button id="save-details-btn" class="edit-mode">Save Changes</button>
                <button id="cancel-details-btn" class="edit-mode">Cancel</button>
            </div>
             <p id="update-status" class="update-status-message"></p>
        </div>

        <!-- This section is the same as the student page -->
        <div class="records-section">
            <h2>Your Medical History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Diagnosis</th>
                        <th>Medications</th>
                        <th>Remarks</th>
                        <th>Medical Certificate</th>
                    </tr>
                </thead>
                <tbody id="records-table">
                    <tr><td colspan="5" class="table-message">Loading history...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Make sure to link to the new employee JS file -->
    <script src="js/medical_emp.js"></script>
</body>
</html>
